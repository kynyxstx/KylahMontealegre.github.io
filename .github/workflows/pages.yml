name: Manually approved Pages release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character main commit separately authorized for publication
        required: true
        type: string

permissions: {}
concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PAGES_RELEASE_ENABLED == 'true' &&
      vars.PAGES_RELEASE_SHA != '' &&
      inputs.release_sha == vars.PAGES_RELEASE_SHA &&
      github.sha == vars.PAGES_RELEASE_SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Vite official deployment reference
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/validate-release.mjs --release
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PAGES_RELEASE_ENABLED == 'true' &&
      github.sha == vars.PAGES_RELEASE_SHA &&
      inputs.release_sha == vars.PAGES_RELEASE_SHA
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
